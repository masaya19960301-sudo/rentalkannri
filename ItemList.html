<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f0f2f5; }
  .header { background: #4a90d9; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 18px; }
  .header-links a { color: #fff; text-decoration: none; font-size: 14px; margin-left: 16px; }
  .container { max-width: 1200px; margin: 20px auto; padding: 0 12px; }
  .filter-bar { padding: 12px 16px; background: #fff; border-radius: 10px 10px 0 0; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-bar label { font-size: 13px; font-weight: 600; color: #555; }
  .filter-bar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .filter-bar select:focus { border-color: #4a90d9; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 0 0 10px 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  th { background: #4a90d9; color: #fff; padding: 10px 8px; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 9px 8px; border-bottom: 1px solid #eee; white-space: nowrap; }
  tr:hover { background: #f8f9fb; }
  .id-link { color: #4a90d9; text-decoration: underline; cursor: pointer; }
  .status-rented { color: #888; font-weight: 600; }
  .status-scheduled { color: #f0ad4e; font-weight: 600; }
  .status-available { background: #5cb85c; color: #fff; font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-block; font-size: 12px; }
  .loading { text-align: center; padding: 40px; color: #999; }
</style>
</head>
<body>
  <div class="header">
    <h1>レンタル品一覧</h1>
    <div class="header-links">
      <? if (isAdmin) { ?>
        <a href="#" onclick="goHome(); return false;">ホーム</a>
      <? } else { ?>
        <a href="#" onclick="goLogin(); return false;">ログイン</a>
      <? } ?>
    </div>
  </div>
  <div class="container">
    <div class="filter-bar" id="filterBar" style="display:none;">
      <label>項目で絞り込み：</label>
      <select id="filterItem" onchange="applyFilter()">
        <option value="">すべて</option>
      </select>
    </div>
    <div class="table-wrap">
      <div class="loading" id="loading">読み込み中...</div>
      <table id="itemTable" style="display:none;">
        <thead>
          <tr>
            <th>項目</th><th>品名</th><th>名称</th><th>ID</th><th>貸出状況</th>
            <th>伝No</th><th>お客様名</th><th>貸出日</th><th>返却予定日</th>
            <th>状態</th><th>店</th><th>担当</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    var IS_ADMIN = <?= isAdmin ?>;
    var BASE_URL = '';

    google.script.run.withSuccessHandler(function(url) {
      BASE_URL = url;
    }).getAppUrl();

    function goHome() {
      window.top.location.href = BASE_URL + '?page=adminHome&admin=1';
    }
    function goLogin() {
      window.top.location.href = BASE_URL + '?page=login';
    }

    var allItems = [];

    google.script.run.withSuccessHandler(function(items) {
      allItems = items;
      buildFilter();
      renderTable();
    }).withFailureHandler(function(e) {
      document.getElementById('loading').textContent = 'エラー: ' + e.message;
    }).getAllItems();

    function buildFilter() {
      var seen = {};
      var categories = [];
      allItems.forEach(function(it) {
        if (it.item && !seen[it.item]) {
          seen[it.item] = true;
          categories.push(it.item);
        }
      });
      var sel = document.getElementById('filterItem');
      categories.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
      document.getElementById('filterBar').style.display = 'flex';
    }

    function applyFilter() {
      renderTable();
    }

    function renderTable() {
      document.getElementById('loading').style.display = 'none';
      var table = document.getElementById('itemTable');
      table.style.display = 'table';
      var tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      var filterVal = document.getElementById('filterItem').value;
      allItems.forEach(function(it) {
        if (filterVal && it.item !== filterVal) return;
        var tr = document.createElement('tr');
        var statusClass = it.status === '貸出中' ? 'status-rented' : it.status === '貸出予定' ? 'status-scheduled' : 'status-available';

        var idCell;
        if (IS_ADMIN) {
          idCell = '<td><a class="id-link" onclick="window.top.location.href=\'' + BASE_URL + '?page=itemEdit&admin=1&row=' + it.row + '\'; return false;" href="#">' + esc(it.id) + '</a></td>';
        } else {
          idCell = '<td>' + esc(it.id) + '</td>';
        }

        tr.innerHTML =
          '<td>' + esc(it.item) + '</td>' +
          '<td>' + esc(it.product) + '</td>' +
          '<td>' + esc(it.name) + '</td>' +
          idCell +
          '<td class="' + statusClass + '">' + esc(it.status) + '</td>' +
          '<td>' + esc(it.slipNo) + '</td>' +
          '<td>' + esc(it.customer) + '</td>' +
          '<td>' + esc(it.lendDate) + '</td>' +
          '<td>' + esc(it.returnDate) + '</td>' +
          '<td>' + esc(it.condition) + '</td>' +
          '<td>' + esc(it.shop) + '</td>' +
          '<td>' + esc(it.staff) + '</td>';
        tbody.appendChild(tr);
      });
    }

    function esc(v) {
      if (v == null) return '';
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(v));
      return d.innerHTML;
    }
  </script>
</body>
</html>
